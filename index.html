<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Auth screen ───────────────────────────────────── */
    #authScreen {
      position: fixed;
      inset: 0;
      background: #f5f4f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 300;
    }

    .auth-box {
      background: #fff;
      border: 1px solid #e8e6e1;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
    }

    .auth-box h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
    .auth-box > p { font-size: 0.875rem; color: #777; margin-bottom: 28px; }

    /* ── App (hidden until logged in) ─────────────────── */
    #app { display: none; padding: 48px 24px; }

    header {
      max-width: 760px;
      margin: 0 auto 48px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    header p  { margin-top: 6px; font-size: 0.9rem; color: #777; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-top: 6px;
    }

    #headerUser { font-size: 0.8rem; color: #aaa; }

    .hdr-btn {
      background: none;
      border: 1px solid #ddd;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      color: #555;
      transition: background 0.1s;
      white-space: nowrap;
    }

    .hdr-btn:hover { background: #f0ede8; }

    /* ── Secties ───────────────────────────────────────── */
    .tool-section { margin-bottom: 32px; }
    .section-title {
      max-width: 760px;
      margin: 0 auto 14px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #999;
    }
    .tool-section.empty { display: none; }

    /* ── Grid ──────────────────────────────────────────── */
    .grid {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      align-items: start;
    }

    .card {
      background: #fff;
      border: 1px solid #e8e6e1;
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow 0.15s, transform 0.15s;
      cursor: pointer;
    }

    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-2px); }

    .card-icon  { font-size: 1.6rem; line-height: 1; }
    .card-title { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
    .card-desc  { font-size: 0.82rem; color: #777; line-height: 1.5; }
    .card-tag   { margin-top: auto; font-size: 0.72rem; color: #4a7c59; text-transform: uppercase; letter-spacing: 0.04em; }

    .card-btn {
      margin-top: auto;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }

    .card-btn:hover { background: #333; }

    /* ── Task tile ─────────────────────────────────────── */
    .task-card { cursor: pointer; }

    .task-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .task-card-top-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-plus-btn {
      width: 28px;
      height: 28px;
      background: #f0ede8;
      border: none;
      border-radius: 7px;
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      flex-shrink: 0;
      transition: background 0.1s;
    }

    .task-plus-btn:hover { background: #e0ddd8; }

    .task-preview-list { display: flex; flex-direction: column; gap: 3px; }

    .task-preview-row {
      font-size: 0.82rem;
      color: #333;
      padding: 4px 0;
      border-bottom: 1px solid #f0ede8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }

    .task-preview-row:last-child { border-bottom: none; }

    .task-preview-empty { font-size: 0.82rem; color: #ccc; font-style: italic; }

    .task-preview-more { font-size: 0.74rem; color: #aaa; margin-top: 4px; }

    /* ── Modals & Backdrops ────────────────────────────── */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .backdrop.open { display: flex; }

    #quickAddBackdrop { z-index: 210; }

    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #999;
      line-height: 1;
      padding: 4px;
    }

    .modal-close:hover { color: #333; }

    .modal h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 22px; }

    .modal-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-header-row h2 { margin-bottom: 0; }

    .add-icon-btn {
      width: 32px;
      height: 32px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.15s;
    }

    .add-icon-btn:hover { background: #333; }

    /* ── Active task items ─────────────────────────────── */
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #e8e6e1;
      margin-bottom: 6px;
      transition: box-shadow 0.1s, opacity 0.1s;
      user-select: none;
    }

    .task-item[draggable="true"] { cursor: grab; }
    .task-item[draggable="true"]:active { cursor: grabbing; }
    .task-item.drag-over { box-shadow: 0 0 0 2px #1a1a1a; }
    .task-item.dragging  { opacity: 0.35; }

    .drag-handle { color: #d0cdc8; font-size: 0.95rem; flex-shrink: 0; line-height: 1; }

    .task-text {
      flex: 1;
      font-size: 0.875rem;
      color: #1a1a1a;
      line-height: 1.45;
      word-break: break-word;
    }

    .task-done-btn {
      width: 22px;
      height: 22px;
      background: none;
      border: 1.5px solid #ccc;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.68rem;
      color: #bbb;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.12s, background 0.12s, color 0.12s;
    }

    .task-done-btn:hover { border-color: #4a7c59; background: #edf4ef; color: #4a7c59; }

    /* ── Completed tasks ───────────────────────────────── */
    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin: 20px 0 10px;
    }

    .task-item.done {
      cursor: default;
      background: #fafaf8;
      border-color: #eeece8;
    }

    .task-item.done .task-text {
      color: #aaa;
      text-decoration: line-through;
      flex: 1;
    }

    .done-time {
      font-size: 0.72rem;
      color: #bbb;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Admin user rows ───────────────────────────────── */
    .user-row {
      background: #fafaf8;
      border: 1px solid #e8e6e1;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .user-row-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .user-email { font-size: 0.875rem; font-weight: 500; word-break: break-all; }

    .app-chips { display: flex; flex-wrap: wrap; gap: 5px; }

    .chip {
      font-size: 0.73rem;
      padding: 3px 10px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid #e0ddd8;
      background: #f5f4f0;
      color: #888;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      user-select: none;
    }

    .chip.on { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }

    .del-btn {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 2px 4px;
      flex-shrink: 0;
    }

    .del-btn:hover { color: #c0392b; }

    /* ── Form elements ─────────────────────────────────── */
    .fg { margin-bottom: 14px; }

    .fg label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: #555;
      margin-bottom: 5px;
    }

    .fg label span { color: #bbb; font-weight: 400; }

    select,
    input[type="date"],
    input[type="number"],
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #e0ddd8;
      border-radius: 8px;
      font-size: 0.87rem;
      background: #fafaf8;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      appearance: auto;
    }

    select:focus, input:focus { border-color: #1a1a1a; background: #fff; }
    select:disabled { opacity: 0.45; cursor: not-allowed; }

    .quick-btns { display: flex; gap: 6px; margin-top: 8px; }

    .qbtn {
      flex: 1;
      background: #f0ede8;
      border: none;
      border-radius: 7px;
      padding: 7px 0;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
    }

    .qbtn:hover { background: #e0ddd8; }

    .submit-btn {
      width: 100%;
      padding: 11px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }

    .submit-btn:hover { background: #333; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg { font-size: 0.82rem; text-align: center; margin-top: 10px; min-height: 1.2em; }
    .msg.ok  { color: #4a7c59; }
    .msg.err { color: #c0392b; }

    /* ── Mic input ─────────────────────────────────────── */
    .input-mic-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .input-mic-row input { flex: 1; }

    .mic-btn {
      width: 42px;
      flex-shrink: 0;
      background: #f0ede8;
      border: 1px solid #e0ddd8;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, border-color 0.1s;
    }

    .mic-btn:hover { background: #e0ddd8; }

    .mic-btn.recording {
      background: #fff0f0;
      border-color: #e74c3c;
      animation: mic-pulse 1s ease-in-out infinite;
    }

    @keyframes mic-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }
  </style>
</head>
<body>

  <!-- ── Auth screen ──────────────────────────────────── -->
  <div id="authScreen">
    <div class="auth-box">
      <h1>Tools</h1>
      <p>Persoonlijke toolbox van Robert</p>
      <div class="fg">
        <label>E-mailadres</label>
        <input type="email" id="authEmail" placeholder="jouw@email.nl"
          onkeydown="if(event.key==='Enter')doHubLogin()">
      </div>
      <div class="fg">
        <label>Wachtwoord</label>
        <input type="password" id="authPw" placeholder="••••••••"
          onkeydown="if(event.key==='Enter')doHubLogin()">
      </div>
      <button class="submit-btn" id="btnHubLogin" onclick="doHubLogin()">Inloggen</button>
      <p class="msg" id="authMsg"></p>
    </div>
  </div>

  <!-- ── Main app ─────────────────────────────────────── -->
  <div id="app">
    <header>
      <div>
        <h1>Tools</h1>
        <p>Persoonlijke toolbox van Robert</p>
      </div>
      <div class="header-actions">
        <span id="headerUser"></span>
        <button id="adminBtn" class="hdr-btn" style="display:none"
          onclick="openAdminModal()">⚙ Beheer</button>
        <button class="hdr-btn" onclick="doLogout()">Uitloggen</button>
      </div>
    </header>
    <div id="section-prive" class="tool-section">
      <h2 class="section-title">Privé</h2>
      <div class="grid" id="tileGrid-prive"></div>
    </div>
    <div id="section-zakelijk" class="tool-section">
      <h2 class="section-title">Zakelijk</h2>
      <div class="grid" id="tileGrid-zakelijk"></div>
    </div>
  </div>

  <!-- ── Quick-add backdrop ───────────────────────────── -->
  <div class="backdrop" id="quickAddBackdrop"
    onclick="if(event.target===this)closeQuickAdd()">
    <div class="modal" style="max-width:380px">
      <button class="modal-close" onclick="closeQuickAdd()">✕</button>
      <h2>Taak toevoegen</h2>
      <div class="fg">
        <div class="input-mic-row">
          <input type="text" id="quickAddInput" placeholder="Wat moet je doen?"
            maxlength="200" onkeydown="if(event.key==='Enter')submitQuickAdd()">
          <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Inspreken (zeg EINDE om op te slaan)">🎤</button>
        </div>
      </div>
      <button class="submit-btn" onclick="submitQuickAdd()">Toevoegen</button>
      <p class="msg" id="quickAddMsg"></p>
    </div>
  </div>

  <!-- ── Task modal ───────────────────────────────────── -->
  <div class="backdrop" id="taskBackdrop"
    onclick="if(event.target===this)closeTaskModal()">
    <div class="modal" style="max-width:480px">
      <button class="modal-close" onclick="closeTaskModal()">✕</button>
      <div class="modal-header-row">
        <h2>Taken</h2>
        <button class="add-icon-btn" onclick="openQuickAdd()">+</button>
      </div>
      <div id="taskActiveList"></div>
      <div id="completedSection" style="display:none">
        <div class="section-label">Gedaan</div>
        <div id="taskCompletedList"></div>
      </div>
    </div>
  </div>

  <!-- ── Uren modal ───────────────────────────────────── -->
  <div class="backdrop" id="urenBackdrop"
    onclick="if(event.target===this)closeUrenModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeUrenModal()">✕</button>

      <div id="vLogin">
        <h2>Inloggen bij SoloFlow</h2>
        <div class="fg">
          <label>E-mailadres</label>
          <input type="email" id="loginEmail" placeholder="jouw@email.nl"
            onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <div class="fg">
          <label>Wachtwoord</label>
          <input type="password" id="loginPw" placeholder="••••••••"
            onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="submit-btn" id="btnLogin" onclick="doLogin()">Inloggen</button>
        <p class="msg" id="loginMsg"></p>
      </div>

      <div id="vEntry" style="display:none">
        <h2>Uren invoeren</h2>
        <div class="fg">
          <label>Datum</label>
          <input type="date" id="eDate">
        </div>
        <div class="fg">
          <label>Opdrachtgever</label>
          <select id="eClient" onchange="loadProjects()">
            <option value="">— kies opdrachtgever —</option>
          </select>
        </div>
        <div class="fg">
          <label>Project</label>
          <select id="eProject" onchange="loadActivities()" disabled>
            <option value="">— kies project —</option>
          </select>
        </div>
        <div class="fg">
          <label>Activiteit <span>(optioneel)</span></label>
          <select id="eActivity" disabled>
            <option value="">— geen —</option>
          </select>
        </div>
        <div class="fg">
          <label>Uren</label>
          <input type="number" id="eHours" min="0" step="0.25" placeholder="0">
          <div class="quick-btns">
            <button class="qbtn" onclick="addH(0.25)">+¼u</button>
            <button class="qbtn" onclick="addH(0.5)">+½u</button>
            <button class="qbtn" onclick="addH(1)">+1u</button>
            <button class="qbtn" onclick="addH(2)">+2u</button>
          </div>
        </div>
        <div class="fg">
          <label>Omschrijving <span>(optioneel)</span></label>
          <input type="text" id="eDesc" placeholder="Wat heb je gedaan?">
        </div>
        <button class="submit-btn" id="btnSubmit" onclick="submitEntry()">Vastleggen</button>
        <p class="msg" id="entryMsg"></p>
      </div>
    </div>
  </div>

  <!-- ── Admin modal ──────────────────────────────────── -->
  <div class="backdrop" id="adminBackdrop"
    onclick="if(event.target===this)closeAdminModal()">
    <div class="modal" style="max-width:520px">
      <button class="modal-close" onclick="closeAdminModal()">✕</button>
      <h2>Gebruikersbeheer</h2>

      <div id="adminUserList"></div>

      <div class="section-label" style="margin-top:22px">Nieuw account</div>

      <div class="fg">
        <label>E-mailadres</label>
        <input type="email" id="newUserEmail" placeholder="nieuw@email.nl">
      </div>
      <div class="fg">
        <label>Tijdelijk wachtwoord</label>
        <input type="text" id="newUserPw" placeholder="TempWW123!">
      </div>
      <div class="fg">
        <label>Toegang tot apps:</label>
        <div class="app-chips" id="newUserAppChips"></div>
      </div>
      <button class="submit-btn" onclick="createUser()">Account aanmaken</button>
      <p class="msg" id="adminMsg"></p>
    </div>
  </div>

  <script>
    // Hub: login, taken, gebruikersbeheer
    const HUB_URL  = 'https://swrunlzeydmcskceqdju.supabase.co'
    const HUB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3cnVubHpleWRtY3NrY2VxZGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNjE2MDgsImV4cCI6MjA5MjkzNzYwOH0.V7haNdFPFJuvJJTbjhiUzKrWG8trW4UeRIJveAhFOgs'
    const sb = supabase.createClient(HUB_URL, HUB_KEY)

    // SoloFlow: uren registreren (aparte Supabase-instantie)
    const SOLO_URL = 'https://mnsqyclmihxypccmapmj.supabase.co'
    const SOLO_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uc3F5Y2xtaWh4eXBjY21hcG1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2OTcwODQsImV4cCI6MjA4MzI3MzA4NH0.wCi1NJdroTEo8SDdSPmWZ7_SR4r4VP2DANs_D4-WJUk'
    const sbSolo = supabase.createClient(SOLO_URL, SOLO_KEY, { auth: { storageKey: 'solo-auth' } })

    const ADMIN_EMAIL = 'robert@circe-advies.nl'

    // ── App definitions ────────────────────────────────
    const APPS = [
      { key: 'daglicht', category: 'prive', icon: '☀️',  title: 'Daglicht',           desc: 'Bekijk hoeveel daglicht er vandaag en de komende dagen is.', href: '/daglicht/' },
      { key: 'claude',   category: 'prive', icon: '🤖',  title: 'Claude gebruik',     desc: 'Bekijk je sessiegebruik, wekelijks limiet en plan.',          href: 'https://claude.ai/settings/usage', external: true },
      { key: 'uren',     category: 'prive', icon: '⏱️',  title: 'Uren schrijven',     desc: 'Snel uren registreren in SoloFlow.',                          action: 'uren' },
      { key: 'taken',    category: 'prive', icon: '✅',  title: 'Taken',              special: 'tasks' },
      { key: 'docs',     category: 'prive', icon: '📄',  title: 'Documenten → tekst', desc: 'Extraheer tekst uit Word-, PowerPoint-, PDF- of EPUB-bestand.',     href: '/document-extractor/' },
      { key: 'rijradius', category: 'prive', icon: '🗺️', title: 'Rijradius', desc: 'Voer een startlocatie en aantal kilometers in en zie op een kaart waar je uitkomt.', href: '/rijradius/' },
      { key: 'respyre',  category: 'zakelijk', icon: '🌿', title: 'Respyre antwoorden', desc: 'Plak een binnengekomen aanvraag en genereer een concept-antwoord in jouw stijl.', href: '/respyre/' },
    ]

    // ── State ──────────────────────────────────────────
    let me           = null
    let isAdmin      = false
    let allowedApps  = []
    let activeTasks  = []
    let doneTasks    = []
    let dragSrcId    = null

    // ── Boot ───────────────────────────────────────────
    ;(async () => {
      const { data: { session } } = await sb.auth.getSession()
      if (session) await onAuth(session.user)
    })()

    async function onAuth(user) {
      me      = user
      isAdmin = user.email === ADMIN_EMAIL

      if (isAdmin) {
        allowedApps = APPS.map(a => a.key)
      } else {
        const { data } = await sb.from('hub_permissions').select('app_key').eq('user_id', user.id)
        allowedApps = (data || []).map(r => r.app_key)
      }

      document.getElementById('authScreen').style.display = 'none'
      document.getElementById('app').style.display        = 'block'
      document.getElementById('headerUser').textContent   = user.email
      if (isAdmin) document.getElementById('adminBtn').style.display = ''

      renderTiles()
      if (allowedApps.includes('taken')) await loadTasks()
    }

    // ── Auth ───────────────────────────────────────────
    async function doHubLogin() {
      const email = document.getElementById('authEmail').value.trim()
      const pw    = document.getElementById('authPw').value
      const btn   = document.getElementById('btnHubLogin')
      const msg   = document.getElementById('authMsg')
      if (!email || !pw) { setMsg(msg, 'Vul e-mail en wachtwoord in.', false); return }
      btn.disabled = true; btn.textContent = 'Bezig...'
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw })
      btn.disabled = false; btn.textContent = 'Inloggen'
      if (error) setMsg(msg, 'Inloggen mislukt. Controleer je gegevens.', false)
      else await onAuth(data.user)
    }

    async function doLogout() {
      await sb.auth.signOut()
      location.reload()
    }

    // ── Tiles ──────────────────────────────────────────
    function renderTiles() {
      const categorieen = ['prive', 'zakelijk']
      categorieen.forEach(cat => {
        const grid = document.getElementById('tileGrid-' + cat)
        const sectie = document.getElementById('section-' + cat)
        grid.innerHTML = ''
        const apps = APPS.filter(a => (a.category || 'prive') === cat && allowedApps.includes(a.key))
        apps.forEach(app => grid.appendChild(buildTile(app)))
        // Verberg een sectie zonder toegankelijke tools
        sectie.classList.toggle('empty', apps.length === 0)
      })
    }

    function buildTile(app) {
      if (app.special === 'tasks') return buildTaskTile()

      if (app.href) {
        const a = document.createElement('a')
        a.className = 'card'
        a.href = app.href
        if (app.external) a.target = '_blank'
        a.innerHTML = `
          <div class="card-icon">${app.icon}</div>
          <div class="card-title">${app.title}</div>
          <div class="card-desc">${app.desc}</div>
          <div class="card-tag">Beschikbaar</div>`
        return a
      }

      const div = document.createElement('div')
      div.className = 'card'
      div.innerHTML = `
        <div class="card-icon">${app.icon}</div>
        <div class="card-title">${app.title}</div>
        <div class="card-desc">${app.desc}</div>
        <button class="card-btn" onclick="openUrenModal()">+ Uren invoeren</button>`
      return div
    }

    function buildTaskTile() {
      const div = document.createElement('div')
      div.className = 'card task-card'
      div.onclick = openTaskModal
      div.innerHTML = `
        <div class="task-card-top">
          <div class="task-card-top-left">
            <span class="card-icon">✅</span>
            <span class="card-title">Taken</span>
          </div>
          <button class="task-plus-btn"
            onclick="event.stopPropagation();openQuickAdd()">+</button>
        </div>
        <div class="task-preview-list" id="taskPreview"></div>`
      return div
    }

    // ── Tasks: load & render preview ───────────────────
    async function loadTasks() {
      const [aRes, dRes] = await Promise.all([
        sb.from('tasks').select('*')
          .eq('user_id', me.id).is('completed_at', null)
          .order('position'),
        sb.from('tasks').select('*')
          .eq('user_id', me.id).not('completed_at', 'is', null)
          .order('completed_at', { ascending: false }).limit(40)
      ])
      activeTasks = aRes.data || []
      doneTasks   = dRes.data || []
      renderPreview()
    }

    function renderPreview() {
      const el = document.getElementById('taskPreview')
      if (!el) return
      el.innerHTML = ''
      if (activeTasks.length === 0) {
        el.innerHTML = '<span class="task-preview-empty">Geen openstaande taken</span>'
        return
      }
      activeTasks.slice(0, 8).forEach(t => {
        const row = document.createElement('div')
        row.className = 'task-preview-row'
        row.textContent = t.text
        el.appendChild(row)
      })
      if (activeTasks.length > 8) {
        const more = document.createElement('div')
        more.className = 'task-preview-more'
        more.textContent = `+${activeTasks.length - 8} meer`
        el.appendChild(more)
      }
    }

    // ── Tasks: modal ───────────────────────────────────
    function openTaskModal() {
      renderTaskModal()
      document.getElementById('taskBackdrop').classList.add('open')
    }

    function closeTaskModal() {
      document.getElementById('taskBackdrop').classList.remove('open')
    }

    function renderTaskModal() {
      const activeList = document.getElementById('taskActiveList')
      activeList.innerHTML = ''
      if (activeTasks.length === 0) {
        activeList.innerHTML = '<p style="font-size:.85rem;color:#ccc;text-align:center;padding:18px 0">Geen taken — druk + om iets toe te voegen</p>'
      } else {
        activeTasks.forEach(t => activeList.appendChild(buildActiveItem(t)))
      }

      const completedSection = document.getElementById('completedSection')
      const completedList    = document.getElementById('taskCompletedList')
      completedList.innerHTML = ''
      if (doneTasks.length > 0) {
        completedSection.style.display = 'block'
        doneTasks.forEach(t => completedList.appendChild(buildDoneItem(t)))
      } else {
        completedSection.style.display = 'none'
      }
    }

    function buildActiveItem(task) {
      const div = document.createElement('div')
      div.className = 'task-item'
      div.draggable = true
      div.dataset.id = task.id
      div.innerHTML = `
        <span class="drag-handle" title="Slepen om te sorteren">⠿</span>
        <span class="task-text">${esc(task.text)}</span>
        <button class="task-done-btn" title="Markeer als gedaan"
          onclick="completeTask('${task.id}')">✓</button>`

      div.addEventListener('dragstart', e => {
        dragSrcId = task.id
        div.classList.add('dragging')
        e.dataTransfer.effectAllowed = 'move'
      })
      div.addEventListener('dragend', () => div.classList.remove('dragging'))
      div.addEventListener('dragover', e => {
        e.preventDefault()
        document.querySelectorAll('#taskActiveList .task-item')
          .forEach(el => el.classList.remove('drag-over'))
        div.classList.add('drag-over')
      })
      div.addEventListener('dragleave', () => div.classList.remove('drag-over'))
      div.addEventListener('drop', e => {
        e.preventDefault()
        div.classList.remove('drag-over')
        if (dragSrcId && dragSrcId !== task.id) reorderTask(dragSrcId, task.id)
      })
      return div
    }

    function buildDoneItem(task) {
      const div = document.createElement('div')
      div.className = 'task-item done'
      const d    = new Date(task.completed_at)
      const days = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag']
      const dateStr = `${days[d.getDay()]} ${d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'})} ${d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}`
      div.innerHTML = `
        <span class="task-text">${esc(task.text)}</span>
        <span class="done-time">${dateStr}</span>`
      return div
    }

    // ── Tasks: quick-add ──────────────────────────────
    function openQuickAdd() {
      document.getElementById('quickAddInput').value = ''
      document.getElementById('quickAddMsg').textContent = ''
      document.getElementById('quickAddBackdrop').classList.add('open')
      setTimeout(() => {
        const inp = document.getElementById('quickAddInput')
        inp.focus()
        inp.select()
      }, 120)
    }

    function closeQuickAdd() {
      stopVoice()
      document.getElementById('quickAddBackdrop').classList.remove('open')
    }

    // ── Voice input ────────────────────────────────────
    let recognition  = null
    let isRecording  = false

    function toggleVoice() {
      isRecording ? stopVoice() : startVoice()
    }

    function startVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition
      if (!SR) {
        setMsg(document.getElementById('quickAddMsg'), 'Spraakherkenning niet beschikbaar in deze browser.', false)
        return
      }
      recognition = new SR()
      recognition.lang = 'nl-NL'
      recognition.continuous = true
      recognition.interimResults = true

      recognition.onstart = () => {
        isRecording = true
        document.getElementById('micBtn').classList.add('recording')
        document.getElementById('quickAddInput').placeholder = 'Zeg je taak... eindig met EINDE'
        document.getElementById('quickAddInput').value = ''
      }

      recognition.onresult = (e) => {
        let text = ''
        for (let i = e.resultIndex; i < e.results.length; i++) {
          text += e.results[i][0].transcript
        }
        const lower = text.toLowerCase()
        if (lower.includes('einde')) {
          const clean = text.replace(/einde/gi, '').trim()
          document.getElementById('quickAddInput').value = clean
          stopVoice()
          if (clean) submitQuickAdd()
        } else {
          document.getElementById('quickAddInput').value = text
        }
      }

      recognition.onerror = () => stopVoice()
      recognition.onend   = () => { if (isRecording) recognition.start() }
      recognition.start()
    }

    function stopVoice() {
      isRecording = false
      if (recognition) { recognition.onend = null; recognition.stop(); recognition = null }
      const btn = document.getElementById('micBtn')
      if (btn) btn.classList.remove('recording')
      const inp = document.getElementById('quickAddInput')
      if (inp) inp.placeholder = 'Wat moet je doen?'
    }

    async function submitQuickAdd() {
      const text = document.getElementById('quickAddInput').value.trim()
      const msg  = document.getElementById('quickAddMsg')
      if (!text) return

      const maxPos = activeTasks.length > 0
        ? Math.max(...activeTasks.map(t => t.position)) + 1
        : 0

      const { data, error } = await sb.from('tasks')
        .insert({ user_id: me.id, text, position: maxPos })
        .select().single()

      if (error) { setMsg(msg, 'Fout bij opslaan.', false); return }

      activeTasks.push(data)
      renderPreview()
      if (document.getElementById('taskBackdrop').classList.contains('open')) renderTaskModal()
      closeQuickAdd()
    }

    // ── Tasks: complete & reorder ──────────────────────
    async function completeTask(id) {
      const now = new Date().toISOString()
      const { error } = await sb.from('tasks').update({ completed_at: now }).eq('id', id)
      if (error) return
      const task = activeTasks.find(t => t.id === id)
      if (task) {
        task.completed_at = now
        activeTasks = activeTasks.filter(t => t.id !== id)
        doneTasks.unshift(task)
        renderPreview()
        renderTaskModal()
      }
    }

    async function reorderTask(srcId, targetId) {
      const si = activeTasks.findIndex(t => t.id === srcId)
      const ti = activeTasks.findIndex(t => t.id === targetId)
      if (si === -1 || ti === -1) return
      const [moved] = activeTasks.splice(si, 1)
      activeTasks.splice(ti, 0, moved)
      activeTasks.forEach((t, i) => { t.position = i })
      renderPreview()
      renderTaskModal()
      // Persist new positions
      await sb.from('tasks').upsert(
        activeTasks.map(t => ({
          id: t.id, user_id: t.user_id, text: t.text,
          position: t.position, created_at: t.created_at, completed_at: t.completed_at
        }))
      )
    }

    // ── Uren modal ────────────────────────────────────
    document.getElementById('eDate').value = new Date().toISOString().slice(0, 10)

    async function openUrenModal() {
      document.getElementById('urenBackdrop').classList.add('open')
      const { data: { session } } = await sbSolo.auth.getSession()
      if (session) { showEntry(); loadClients() } else showSoloLogin()
    }

    function closeUrenModal() {
      document.getElementById('urenBackdrop').classList.remove('open')
      document.getElementById('loginMsg').textContent  = ''
      document.getElementById('entryMsg').textContent  = ''
    }

    function showSoloLogin() {
      document.getElementById('vLogin').style.display = 'block'
      document.getElementById('vEntry').style.display = 'none'
    }

    function showEntry() {
      document.getElementById('vLogin').style.display = 'none'
      document.getElementById('vEntry').style.display = 'block'
    }

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim()
      const pw    = document.getElementById('loginPw').value
      const btn   = document.getElementById('btnLogin')
      const msg   = document.getElementById('loginMsg')
      if (!email || !pw) { setMsg(msg, 'Vul e-mail en wachtwoord in.', false); return }
      btn.disabled = true; btn.textContent = 'Bezig...'
      const { error } = await sbSolo.auth.signInWithPassword({ email, password: pw })
      btn.disabled = false; btn.textContent = 'Inloggen'
      if (error) setMsg(msg, 'Inloggen mislukt.', false)
      else { showEntry(); loadClients() }
    }

    async function loadClients() {
      const { data } = await sbSolo.from('clients').select('id,name').eq('status','active').order('name')
      const sel = document.getElementById('eClient')
      sel.innerHTML = '<option value="">— kies opdrachtgever —</option>'
      ;(data || []).forEach(c => sel.innerHTML += `<option value="${c.id}">${c.name}</option>`)
    }

    async function loadProjects() {
      const cid  = document.getElementById('eClient').value
      const pSel = document.getElementById('eProject')
      const aSel = document.getElementById('eActivity')
      pSel.innerHTML = '<option value="">— kies project —</option>'; pSel.disabled = true
      aSel.innerHTML = '<option value="">— geen —</option>';         aSel.disabled = true
      if (!cid) return
      const { data } = await sbSolo.from('projects').select('id,name').eq('client_id',cid).eq('status','active').order('name')
      ;(data || []).forEach(p => pSel.innerHTML += `<option value="${p.id}">${p.name}</option>`)
      pSel.disabled = false
    }

    async function loadActivities() {
      const pid  = document.getElementById('eProject').value
      const aSel = document.getElementById('eActivity')
      aSel.innerHTML = '<option value="">— geen —</option>'; aSel.disabled = true
      if (!pid) return
      const { data } = await sbSolo.from('activities').select('id,name').eq('project_id',pid).order('name')
      ;(data || []).forEach(a => aSel.innerHTML += `<option value="${a.id}">${a.name}</option>`)
      aSel.disabled = false
    }

    function addH(h) {
      const inp = document.getElementById('eHours')
      inp.value = Math.round((parseFloat(inp.value || 0) + h) * 4) / 4
    }

    async function submitEntry() {
      const cid   = document.getElementById('eClient').value
      const pid   = document.getElementById('eProject').value
      const aid   = document.getElementById('eActivity').value || null
      const date  = document.getElementById('eDate').value
      const hours = parseFloat(document.getElementById('eHours').value)
      const desc  = document.getElementById('eDesc').value.trim() || null
      const msg   = document.getElementById('entryMsg')
      const btn   = document.getElementById('btnSubmit')
      if (!cid || !pid || !date || !hours || hours <= 0) {
        setMsg(msg, 'Vul opdrachtgever, project, datum en uren in.', false); return
      }
      btn.disabled = true; btn.textContent = 'Bezig...'
      const { data: { user } } = await sbSolo.auth.getUser()
      const { error } = await sbSolo.from('time_entries').insert({
        user_id: user.id, client_id: cid, project_id: pid,
        activity_id: aid, date, hours, description: desc
      })
      btn.disabled = false; btn.textContent = 'Vastleggen'
      if (error) setMsg(msg, 'Fout bij opslaan: ' + error.message, false)
      else { setMsg(msg, `✓ ${hours} uur vastgelegd`, true); resetUrenForm() }
    }

    function resetUrenForm() {
      document.getElementById('eClient').value  = ''
      document.getElementById('eProject').innerHTML = '<option value="">— kies project —</option>'
      document.getElementById('eProject').disabled = true
      document.getElementById('eActivity').innerHTML = '<option value="">— geen —</option>'
      document.getElementById('eActivity').disabled = true
      document.getElementById('eHours').value = ''
      document.getElementById('eDesc').value  = ''
      document.getElementById('eDate').value  = new Date().toISOString().slice(0, 10)
    }

    // ── Admin modal ───────────────────────────────────
    async function openAdminModal() {
      document.getElementById('adminBackdrop').classList.add('open')
      await renderAdminUserList()
      renderNewUserChips()
    }

    function closeAdminModal() {
      document.getElementById('adminBackdrop').classList.remove('open')
    }

    async function renderAdminUserList() {
      const [{ data: perms }, { data: infos }] = await Promise.all([
        sb.from('hub_permissions').select('*').order('user_id'),
        sb.from('hub_user_info').select('*')
      ])
      const infoMap = {}
      ;(infos || []).forEach(u => { infoMap[u.user_id] = u })

      // Group permissions by user
      const byUser = {}
      ;(perms || []).forEach(p => {
        if (!byUser[p.user_id]) byUser[p.user_id] = []
        byUser[p.user_id].push(p.app_key)
      })

      const list = document.getElementById('adminUserList')
      list.innerHTML = ''

      if (Object.keys(byUser).length === 0) {
        list.innerHTML = '<p style="font-size:.85rem;color:#bbb;padding:8px 0">Nog geen andere gebruikers.</p>'
        return
      }

      for (const [uid, apps] of Object.entries(byUser)) {
        const info  = infoMap[uid]
        const email = info ? info.email : uid.slice(0, 10) + '...'
        const chips = APPS.map(a => {
          const on = apps.includes(a.key) ? 'on' : ''
          return `<span class="chip ${on}" data-uid="${uid}" data-app="${a.key}"
            onclick="togglePerm(this)">${a.icon} ${a.title}</span>`
        }).join('')
        const row = document.createElement('div')
        row.className = 'user-row'
        row.innerHTML = `
          <div class="user-row-head">
            <div class="user-email">${esc(email)}</div>
            <button class="del-btn" title="Verwijder toegang"
              onclick="removeUser('${uid}')">✕</button>
          </div>
          <div class="app-chips">${chips}</div>`
        list.appendChild(row)
      }
    }

    async function togglePerm(chip) {
      const uid = chip.dataset.uid
      const app = chip.dataset.app
      if (chip.classList.contains('on')) {
        await sb.from('hub_permissions').delete().eq('user_id', uid).eq('app_key', app)
        chip.classList.remove('on')
      } else {
        await sb.from('hub_permissions').insert({ user_id: uid, app_key: app })
        chip.classList.add('on')
      }
    }

    async function removeUser(uid) {
      if (!confirm('Alle toegang verwijderen voor deze gebruiker?')) return
      await Promise.all([
        sb.from('hub_permissions').delete().eq('user_id', uid),
        sb.from('hub_user_info').delete().eq('user_id', uid)
      ])
      await renderAdminUserList()
    }

    function renderNewUserChips() {
      const container = document.getElementById('newUserAppChips')
      container.innerHTML = ''
      APPS.forEach(a => {
        const chip = document.createElement('span')
        chip.className = 'chip'
        chip.dataset.app = a.key
        chip.textContent = `${a.icon} ${a.title}`
        chip.onclick = () => chip.classList.toggle('on')
        container.appendChild(chip)
      })
    }

    async function createUser() {
      const email  = document.getElementById('newUserEmail').value.trim()
      const pw     = document.getElementById('newUserPw').value.trim()
      const msg    = document.getElementById('adminMsg')
      const selApps = [...document.querySelectorAll('#newUserAppChips .chip.on')].map(c => c.dataset.app)
      if (!email || !pw) { setMsg(msg, 'Vul e-mail en wachtwoord in.', false); return }

      const { data, error } = await sb.auth.signUp({ email, password: pw })
      if (error) { setMsg(msg, 'Fout: ' + error.message, false); return }

      const uid = data.user.id
      await sb.from('hub_user_info').insert({ user_id: uid, email })
      if (selApps.length > 0) {
        await sb.from('hub_permissions').insert(selApps.map(app => ({ user_id: uid, app_key: app })))
      }

      setMsg(msg, `✓ Account aangemaakt voor ${email}`, true)
      document.getElementById('newUserEmail').value = ''
      document.getElementById('newUserPw').value    = ''
      renderNewUserChips()
      await renderAdminUserList()
    }

    // ── Helpers ───────────────────────────────────────
    function setMsg(el, text, ok) {
      el.textContent = text
      el.className   = 'msg ' + (ok ? 'ok' : 'err')
    }

    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }
  </script>
</body>
</html>
