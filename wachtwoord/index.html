<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<style>@media (pointer:coarse){input,select,textarea{font-size:16px!important}}</style>
<title>Wachtwoord instellen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { background: #fff; border: 1px solid #e8e6e1; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 380px; }
  h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
  p.lead { font-size: .88rem; color: #777; margin-bottom: 24px; line-height: 1.5; }
  .fg { margin-bottom: 14px; }
  label { display: block; font-size: .78rem; font-weight: 500; color: #555; margin-bottom: 5px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #e0ddd8; border-radius: 8px; font-size: .9rem; background: #fafaf8; outline: none; }
  input:focus { border-color: #1a1a1a; background: #fff; }
  .hint { font-size: .74rem; color: #999; margin-top: 4px; }
  button { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border: none; border-radius: 9px; font-size: .9rem; font-weight: 500; cursor: pointer; margin-top: 6px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { font-size: .84rem; text-align: center; margin-top: 12px; min-height: 1.2em; color: #c0392b; line-height: 1.5; }
  .msg.ok { color: #4a7c59; }
  a { color: #4a7c59; }
</style>
</head>
<body>
<div class="box" id="box">
  <h1>Wachtwoord instellen</h1>
  <p class="lead" id="lead">Kies een wachtwoord voor je account bij Roberts Tools. Daarna log je in met je e-mailadres en dit wachtwoord.</p>
  <form id="form" autocomplete="on">
    <div class="fg"><label for="pw1">Nieuw wachtwoord</label><input type="password" id="pw1" autocomplete="new-password" minlength="10" required><div class="hint">Minimaal 10 tekens.</div></div>
    <div class="fg"><label for="pw2">Herhaal wachtwoord</label><input type="password" id="pw2" autocomplete="new-password" minlength="10" required></div>
    <button type="submit" id="btn">Wachtwoord opslaan</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
</div>

<script>
  const HUB_URL = 'https://swrunlzeydmcskceqdju.supabase.co'
  const HUB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3cnVubHpleWRtY3NrY2VxZGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNjE2MDgsImV4cCI6MjA5MjkzNzYwOH0.V7haNdFPFJuvJJTbjhiUzKrWG8trW4UeRIJveAhFOgs'
  // detectSessionInUrl uit: de link wordt pas verbruikt als de gebruiker zelf op de knop drukt.
  const sb = supabase.createClient(HUB_URL, HUB_KEY, { auth: { detectSessionInUrl: false } })

  const params = new URLSearchParams(location.search)
  const tokenHash = params.get('th')
  const type = params.get('type')
  history.replaceState(null, '', location.pathname) // de code uit de adresbalk halen

  const msg = document.getElementById('msg'), btn = document.getElementById('btn')
  let verified = false

  function say(t, ok) { msg.textContent = t; msg.className = 'msg' + (ok ? ' ok' : '') }

  if (!tokenHash || !['invite', 'recovery'].includes(type)) {
    document.getElementById('form').style.display = 'none'
    document.getElementById('lead').textContent = 'Deze link is niet compleet. Vraag een nieuwe link aan Robert.'
  }

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault()
    const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value
    if (a.length < 10) { say('Gebruik minimaal 10 tekens.'); return }
    if (a !== b) { say('De twee wachtwoorden zijn niet gelijk.'); return }
    btn.disabled = true; say('Bezig...', true)
    try {
      if (!verified) {
        const { error } = await sb.auth.verifyOtp({ token_hash: tokenHash, type })
        if (error) { say('Deze link is verlopen of al gebruikt. Vraag een nieuwe link aan Robert.'); btn.disabled = false; return }
        verified = true
      }
      const { error: upErr } = await sb.auth.updateUser({ password: a })
      if (upErr) { say('Wachtwoord opslaan mislukte: ' + upErr.message + ' Probeer een ander wachtwoord.'); btn.disabled = false; return }
      say('Gelukt. Je wordt doorgestuurd.', true)
      setTimeout(() => { location.href = '/' }, 900)
    } catch (err) {
      say('Er ging iets mis: ' + err.message)
      btn.disabled = false
    }
  })
</script>
</body>
</html>
