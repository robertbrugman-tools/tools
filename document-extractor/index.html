<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documenten → tekst</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 48px 24px;
    }

    header {
      max-width: 560px;
      margin: 0 auto 40px;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    header a {
      font-size: 0.85rem;
      color: #999;
      text-decoration: none;
    }
    header a:hover { color: #1a1a1a; }

    header h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }

    .card {
      background: #fff;
      border: 1px solid #e8e6e1;
      border-radius: 12px;
      padding: 32px;
      max-width: 560px;
      margin: 0 auto;
    }

    /* Drop zone */
    .dropzone {
      border: 2px dashed #d8d5cf;
      border-radius: 10px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: #fafaf8;
    }
    .dropzone:hover, .dropzone.over { border-color: #1a1a1a; background: #f5f4f0; }
    .dropzone.ready { border-color: #4a7c59; background: #f2f8f4; }

    .drop-icon { font-size: 2rem; margin-bottom: 10px; }
    .drop-main { font-size: 0.95rem; font-weight: 600; color: #333; margin-bottom: 4px; }
    .drop-sub  { font-size: 0.8rem; color: #999; }
    .drop-file { font-size: 0.85rem; font-weight: 600; color: #4a7c59; margin-top: 10px; }

    input[type="file"] { display: none; }

    .badges {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 14px;
    }
    .badge {
      background: #f0ede8;
      color: #555;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }

    /* Button */
    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #333; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    .btn.green { background: #4a7c59; }
    .btn.green:hover { background: #3d6849; }

    /* Status */
    .status {
      margin-top: 12px;
      font-size: 0.82rem;
      color: #777;
      text-align: center;
      min-height: 18px;
    }
    .status.ok  { color: #4a7c59; }
    .status.err { color: #c0392b; }

    /* Spinner */
    .spin {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(0,0,0,0.15);
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Preview */
    .preview-wrap { margin-top: 24px; display: none; }
    .preview-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #aaa;
      margin-bottom: 8px;
    }
    .preview {
      background: #fafaf8;
      border: 1px solid #e8e6e1;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      line-height: 1.6;
      white-space: pre;
      overflow: auto;
      max-height: 260px;
      color: #444;
    }
  </style>
</head>
<body>

  <header>
    <a href="/">← Tools</a>
    <h1>Documenten → tekst</h1>
  </header>

  <div class="card">
    <div class="badges">
      <span class="badge">DOCX</span>
      <span class="badge">PPTX</span>
      <span class="badge">PDF</span>
    </div>

    <div class="dropzone" id="dropzone">
      <div class="drop-icon">📄</div>
      <div class="drop-main">Sleep je bestand hierheen, of klik om te kiezen</div>
      <div class="drop-sub">Word, PowerPoint of PDF — max. één bestand</div>
      <div class="drop-file" id="drop-file"></div>
    </div>
    <input type="file" id="file-input" accept=".docx,.pptx,.pdf" />

    <button class="btn" id="btn-extract" disabled>Tekst extraheren</button>
    <div class="status" id="status"></div>

    <div class="preview-wrap" id="preview-wrap">
      <div class="preview-label">Voorbeeld</div>
      <div class="preview" id="preview"></div>
    </div>

    <button class="btn green" id="btn-download" style="display:none">⬇ Download .txt</button>
  </div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const dropzone    = document.getElementById('dropzone');
  const fileInput   = document.getElementById('file-input');
  const dropLabel   = document.getElementById('drop-file');
  const btnExtract  = document.getElementById('btn-extract');
  const statusEl    = document.getElementById('status');
  const previewWrap = document.getElementById('preview-wrap');
  const previewEl   = document.getElementById('preview');
  const btnDownload = document.getElementById('btn-download');

  let selectedFile = null;
  let resultText   = null;

  // ── File picking ────────────────────────────────────────────────────────────
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('over');
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

  function setFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['docx','pptx','pdf'].includes(ext)) {
      setStatus('Niet ondersteund. Gebruik .docx, .pptx of .pdf.', 'err'); return;
    }
    selectedFile = file;
    dropLabel.textContent = file.name;
    dropzone.classList.remove('over'); dropzone.classList.add('ready');
    btnExtract.disabled = false;
    previewWrap.style.display = 'none';
    btnDownload.style.display = 'none';
    resultText = null;
    setStatus('');
  }

  function setStatus(msg, type = '') {
    statusEl.innerHTML = msg;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }

  // ── Extract ─────────────────────────────────────────────────────────────────
  btnExtract.addEventListener('click', async () => {
    if (!selectedFile) return;
    btnExtract.disabled = true;
    previewWrap.style.display = 'none';
    btnDownload.style.display = 'none';
    resultText = null;
    setStatus('<span class="spin"></span> Bezig met extraheren…');

    try {
      const buf = await selectedFile.arrayBuffer();
      const ext = selectedFile.name.split('.').pop().toLowerCase();
      if      (ext === 'docx') resultText = await extractDocx(buf);
      else if (ext === 'pptx') resultText = await extractPptx(buf);
      else if (ext === 'pdf')  resultText = await extractPdf(buf);

      previewEl.textContent = resultText.slice(0, 3000) + (resultText.length > 3000 ? '\n…(alleen begin zichtbaar)' : '');
      previewWrap.style.display = 'block';
      btnDownload.style.display = 'block';
      setStatus('Klaar — ' + resultText.split('\n').length + ' regels.', 'ok');
    } catch (e) {
      console.error(e);
      setStatus('Fout: ' + e.message, 'err');
    }
    btnExtract.disabled = false;
  });

  // ── Download ────────────────────────────────────────────────────────────────
  btnDownload.addEventListener('click', () => {
    if (!resultText) return;
    const base = selectedFile.name.replace(/\.[^.]+$/, '');
    const blob = new Blob([resultText], { type: 'text/plain;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href: url, download: base + '_tekst.txt' });
    a.click(); URL.revokeObjectURL(url);
  });

  // ══════════════════════════════════════════════════════════════════════════
  // DOCX via mammoth.js
  // ══════════════════════════════════════════════════════════════════════════
  async function extractDocx(buf) {
    const r = await mammoth.convertToHtml({ arrayBuffer: buf }, {
      styleMap: [
        "p[style-name='Title']     => h1:fresh",
        "p[style-name='Heading 1'] => h1:fresh",
        "p[style-name='Heading 2'] => h2:fresh",
        "p[style-name='Heading 3'] => h3:fresh",
        "p[style-name='Heading 4'] => h4:fresh",
      ]
    });
    return htmlToText(r.value);
  }

  function htmlToText(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    const lines = [];
    let lvl = 0;

    function walk(node) {
      if (node.nodeType !== 1) return;
      const t = node.tagName.toLowerCase();
      const text = node.textContent.trim();

      if      (t === 'h1') { lines.push(''); lines.push('=== ' + text + ' ==='); lines.push(''); lvl = 1; }
      else if (t === 'h2') { lines.push(''); lines.push(text.toUpperCase()); lines.push(''); lvl = 2; }
      else if (t === 'h3') { lines.push(''); lines.push('  ' + text); lines.push(''); lvl = 3; }
      else if (t === 'h4') { lines.push(''); lines.push('    ' + text); lines.push(''); lvl = 4; }
      else if (t === 'p')  { if (text) lines.push('  '.repeat(Math.max(lvl,1)) + text); }
      else if (t === 'li') { if (text) lines.push('  '.repeat(Math.max(lvl,1)) + '* ' + text); }
      else if (t === 'table') {
        node.querySelectorAll('tr').forEach(row => {
          const cells = [...row.querySelectorAll('td,th')].map(c => c.textContent.trim()).join(' | ');
          if (cells.trim()) lines.push('  '.repeat(Math.max(lvl,1)) + cells);
        });
        lines.push('');
      }
      else node.childNodes.forEach(walk);
    }

    div.childNodes.forEach(walk);
    return clean(lines);
  }

  // ══════════════════════════════════════════════════════════════════════════
  // PPTX via JSZip
  // ══════════════════════════════════════════════════════════════════════════
  async function extractPptx(buf) {
    const zip = await JSZip.loadAsync(buf);
    const lines = [];

    const slideFiles = Object.keys(zip.files)
      .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
      .sort((a, b) => parseInt(a.match(/\d+/)[0]) - parseInt(b.match(/\d+/)[0]));

    for (let i = 0; i < slideFiles.length; i++) {
      const xml = await zip.files[slideFiles[i]].async('text');
      const doc = new DOMParser().parseFromString(xml, 'text/xml');
      const shapes = [...doc.getElementsByTagNameNS('*', 'sp')];

      let titleText = null;
      const bodyItems = [];

      for (const sp of shapes) {
        const ph    = sp.getElementsByTagNameNS('*', 'ph')[0];
        const phType = ph?.getAttribute('type');
        const phIdx  = ph?.getAttribute('idx');
        const isTitle = phType === 'title' || phType === 'ctrTitle' || phIdx === '0';

        const paras = [...sp.getElementsByTagNameNS('*', 'p')];

        if (isTitle && !titleText) {
          const txt = paras.map(p =>
            [...p.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('')
          ).filter(Boolean).join(' ').trim();
          if (txt) { titleText = txt; continue; }
        }

        for (const p of paras) {
          const txt = [...p.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('').trim();
          if (!txt) continue;
          const pPr = p.getElementsByTagNameNS('*','pPr')[0];
          const lvl = parseInt(pPr?.getAttribute('lvl') || '0');
          bodyItems.push({ txt, lvl });
        }
      }

      if (i === 0 && titleText) { lines.push('=== ' + titleText + ' ==='); lines.push(''); }
      lines.push('--- SLIDE ' + (i+1) + (titleText ? ': ' + titleText : '') + ' ---');
      lines.push('');
      for (const { txt, lvl } of bodyItems) lines.push('  ' + '  '.repeat(lvl) + txt);
      lines.push('');
    }

    return clean(lines);
  }

  // ══════════════════════════════════════════════════════════════════════════
  // PDF via PDF.js
  // ══════════════════════════════════════════════════════════════════════════
  async function extractPdf(buf) {
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const allLines = [];

    // Collect font heights for median (body size detection)
    let heights = [];
    for (let pn = 1; pn <= pdf.numPages; pn++) {
      const content = await (await pdf.getPage(pn)).getTextContent();
      heights = heights.concat(content.items.map(i => i.height).filter(h => h > 0));
    }
    heights.sort((a,b) => a-b);
    const body = heights[Math.floor(heights.length/2)] || 10;
    const h1 = body * 1.45, h2 = body * 1.18, h3 = body * 1.05;

    for (let pn = 1; pn <= pdf.numPages; pn++) {
      const content = await (await pdf.getPage(pn)).getTextContent();
      if (pdf.numPages > 1) { if (allLines.at(-1) !== '') allLines.push(''); allLines.push('  [Pagina ' + pn + ']'); allLines.push(''); }

      // Group by y
      const byY = {};
      for (const item of content.items) {
        const y = Math.round(item.transform[5]);
        (byY[y] = byY[y] || []).push(item);
      }

      let curLvl = 0;
      for (const y of Object.keys(byY).map(Number).sort((a,b) => b-a)) {
        const items = byY[y];
        const text  = items.map(i=>i.str).join(' ').trim();
        if (!text) continue;
        const avgH = items.reduce((s,i)=>s+i.height,0)/items.length;

        if      (avgH >= h1) { if (allLines.at(-1) !== '') allLines.push(''); allLines.push(text.toUpperCase()); allLines.push(''); curLvl=1; }
        else if (avgH >= h2) { if (allLines.at(-1) !== '') allLines.push(''); allLines.push('  '+text); allLines.push(''); curLvl=2; }
        else if (avgH >= h3) { if (allLines.at(-1) !== '') allLines.push(''); allLines.push('    '+text); allLines.push(''); curLvl=3; }
        else                 { allLines.push('  '.repeat(Math.max(curLvl,1))+text); }
      }
    }
    return clean(allLines);
  }

  // ── Helper ──────────────────────────────────────────────────────────────────
  function clean(lines) {
    const r = []; let blank = false;
    for (const l of lines) {
      const b = l === '';
      if (b && blank) continue;
      r.push(l); blank = b;
    }
    while (r.length && r[0] === '') r.shift();
    while (r.length && r.at(-1) === '') r.pop();
    return r.join('\n');
  }
</script>
</body>
</html>
