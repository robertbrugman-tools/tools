<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rijradius</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      gap: 10px;
    }

    header h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.02em; }

    /* Controls panel */
    .controls {
      background: #fff;
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
      border-bottom: 1px solid #e0e0e0;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 0.70rem;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .field input {
      border: 1.5px solid #ddd;
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
      background: #fafafa;
      color: #1a1a2e;
      height: 36px;
    }

    .field input:focus {
      border-color: #4f6ef7;
      background: #fff;
    }

    /* Autocomplete wrapper */
    .autocomplete-wrapper {
      position: relative;
    }

    #locatie-input { width: 240px; }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 300px;
      background: #fff;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 1000;
      overflow: hidden;
      display: none;
    }

    .autocomplete-list.open { display: block; }

    .autocomplete-item {
      padding: 9px 13px;
      font-size: 0.88rem;
      cursor: pointer;
      color: #1a1a2e;
      border-bottom: 1px solid #f0f0f0;
      line-height: 1.35;
    }

    .autocomplete-item:last-child { border-bottom: none; }

    .autocomplete-item:hover,
    .autocomplete-item.focused {
      background: #f0f3ff;
      color: #4f6ef7;
    }

    .autocomplete-item .item-sub {
      font-size: 0.76rem;
      color: #999;
      margin-top: 1px;
    }

    /* Standaard-badge in label */
    .default-badge {
      background: #e8edff;
      color: #4f6ef7;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Standaard-knop */
    .default-btn {
      height: 36px;
      padding: 0 12px;
      background: #fafafa;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #777;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      align-self: flex-end;
    }

    .default-btn:hover {
      background: #e8edff;
      color: #4f6ef7;
      border-color: #4f6ef7;
    }

    .default-btn.saved {
      color: #4f6ef7;
      border-color: #4f6ef7;
      background: #e8edff;
    }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      height: 36px;
    }

    .mode-btn {
      padding: 0 14px;
      background: #fafafa;
      border: none;
      font-size: 0.84rem;
      cursor: pointer;
      color: #777;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .mode-btn + .mode-btn { border-left: 1.5px solid #ddd; }
    .mode-btn.active { background: #4f6ef7; color: #fff; font-weight: 600; }

    /* Value inputs */
    .value-group {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .value-group .field input { width: 90px; }

    .zoek-btn {
      padding: 0 18px;
      height: 36px;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .zoek-btn:hover { background: #3a56d4; }
    .zoek-btn:active { transform: scale(0.97); }
    .zoek-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    #status-bar {
      font-size: 0.8rem;
      color: #999;
      align-self: center;
      min-height: 16px;
      flex-shrink: 0;
    }

    #status-bar.error { color: #c0392b; }
    #status-bar.ok    { color: #27ae60; }

    /* Map */
    #map { flex: 1; width: 100%; }

    /* Leaflet popup */
    .info-popup { font-size: 0.87rem; line-height: 1.5; }
    .info-popup strong { color: #1a1a2e; }
  </style>
</head>
<body>

<header>
  <span>🗺️</span>
  <h1>Rijradius</h1>
</header>

<div class="controls">
  <div class="field autocomplete-wrapper">
    <label>
      Startlocatie
      <span class="default-badge" id="default-badge" style="display:none">standaard</span>
    </label>
    <input id="locatie-input" type="text" placeholder="bijv. Haren, Utrecht, 9752…"
      autocomplete="off" />
    <ul class="autocomplete-list" id="autocomplete-list"></ul>
  </div>

  <button class="default-btn" id="save-default-btn" onclick="slaDefaultOp()" title="Sla huidige locatie op als standaard">
    ☆ Sla op als standaard
  </button>

  <div class="field">
    <label>Modus</label>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-km" onclick="setMode('km')">📏 Afstand</button>
      <button class="mode-btn" id="btn-tijd" onclick="setMode('tijd')">⏱ Reistijd</button>
    </div>
  </div>

  <!-- Afstandsmodus -->
  <div class="value-group" id="group-km">
    <div class="field">
      <label>Kilometer</label>
      <input id="km-input" type="number" min="1" max="5000" value="50"
        onkeydown="if(event.key==='Enter')zoek()" />
    </div>
  </div>

  <!-- Reistijdmodus -->
  <div class="value-group" id="group-tijd" style="display:none">
    <div class="field">
      <label>Uren</label>
      <input id="uren-input" type="number" min="0" max="24" value="1"
        onkeydown="if(event.key==='Enter')zoek()" />
    </div>
    <div class="field">
      <label>Minuten</label>
      <input id="min-input" type="number" min="0" max="59" value="30"
        onkeydown="if(event.key==='Enter')zoek()" />
    </div>
  </div>

  <button class="zoek-btn" id="zoek-btn" onclick="zoek()">Toon op kaart</button>
  <span id="status-bar"></span>
</div>

<div id="map"></div>

<script>
  let mode            = 'km'
  let marker          = null
  let layer           = null
  let selectedCoords  = null   // ingesteld zodra gebruiker een suggestie kiest
  let focusedIndex    = -1
  let debounceTimer   = null
  let huidigeDefault  = null   // { label, lat, lon }

  const STORAGE_KEY = 'rijradius_default_location'

  const map = L.map('map').setView([52.2, 5.3], 7)

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 18,
  }).addTo(map)

  const statusBar      = document.getElementById('status-bar')
  const locatieInput   = document.getElementById('locatie-input')
  const suggList       = document.getElementById('autocomplete-list')
  const defaultBadge   = document.getElementById('default-badge')
  const saveDefaultBtn = document.getElementById('save-default-btn')

  // ── Standaard locatie ──────────────────────────────────────────

  function laadDefault() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY)
      if (!raw) return
      huidigeDefault = JSON.parse(raw)
      locatieInput.value = huidigeDefault.label
      selectedCoords     = { lat: huidigeDefault.lat, lon: huidigeDefault.lon }
      defaultBadge.style.display = ''
      saveDefaultBtn.classList.add('saved')
      saveDefaultBtn.textContent = '★ Standaard opgeslagen'
    } catch (_) {}
  }

  function slaDefaultOp() {
    const label = locatieInput.value.trim()
    if (!label) { setStatus('Vul eerst een locatie in.', 'error'); return }

    const entry = {
      label,
      lat: selectedCoords ? selectedCoords.lat : null,
      lon: selectedCoords ? selectedCoords.lon : null,
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entry))
    huidigeDefault = entry
    defaultBadge.style.display = ''
    saveDefaultBtn.classList.add('saved')
    saveDefaultBtn.textContent = '★ Standaard opgeslagen'
    setStatus(`"${label}" opgeslagen als standaard locatie.`, 'ok')
  }

  // ── Autocomplete (Photon) ──────────────────────────────────────

  function sluitSuggesties() {
    suggList.classList.remove('open')
    suggList.innerHTML = ''
    focusedIndex = -1
  }

  async function haalSuggesties(query) {
    // Photon: gratis, geen API-key, NL-biased via lat/lon centrum Nederland
    const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lang=nl&limit=6&lat=52.3&lon=5.3`
    const res  = await fetch(url)
    if (!res.ok) return []
    const data = await res.json()

    return data.features.map(f => {
      const p    = f.properties
      const naam = p.name || ''
      const sub  = [p.postcode, p.city || p.town || p.village || p.county, p.country]
                     .filter(Boolean).join(', ')
      return {
        label: naam,
        sub,
        lat: f.geometry.coordinates[1],
        lon: f.geometry.coordinates[0],
      }
    }).filter(s => s.label)
  }

  function toonSuggesties(suggesties) {
    suggList.innerHTML = ''
    focusedIndex = -1

    if (!suggesties.length) { sluitSuggesties(); return }

    suggesties.forEach((s, i) => {
      const li = document.createElement('li')
      li.className = 'autocomplete-item'
      li.innerHTML = `<div>${s.label}</div><div class="item-sub">${s.sub}</div>`
      li.addEventListener('mousedown', (e) => {
        e.preventDefault()
        kiesSuggestie(s)
      })
      suggList.appendChild(li)
    })

    suggList.classList.add('open')
  }

  function kiesSuggestie(s) {
    locatieInput.value = s.label + (s.sub ? ', ' + s.sub.split(',')[0] : '')
    selectedCoords     = { lat: s.lat, lon: s.lon }
    sluitSuggesties()

    // Reset standaard-badge als de locatie afwijkt van de opgeslagen standaard
    if (huidigeDefault && huidigeDefault.label !== locatieInput.value) {
      defaultBadge.style.display = 'none'
      saveDefaultBtn.classList.remove('saved')
      saveDefaultBtn.textContent = '☆ Sla op als standaard'
    }
  }

  function updateFocus(items) {
    items.forEach((item, i) => {
      item.classList.toggle('focused', i === focusedIndex)
    })
  }

  // Debounced input handler
  locatieInput.addEventListener('input', () => {
    selectedCoords = null  // gebruiker tikt handmatig, reset gekozen coördinaten

    // Badge dimmen als tekst wijzigt t.o.v. standaard
    if (huidigeDefault && locatieInput.value !== huidigeDefault.label) {
      defaultBadge.style.display = 'none'
      saveDefaultBtn.classList.remove('saved')
      saveDefaultBtn.textContent = '☆ Sla op als standaard'
    }

    clearTimeout(debounceTimer)
    const query = locatieInput.value.trim()
    if (query.length < 2) { sluitSuggesties(); return }

    debounceTimer = setTimeout(async () => {
      const suggesties = await haalSuggesties(query)
      toonSuggesties(suggesties)
    }, 280)
  })

  // Toetsenbordnavigatie in de dropdown
  locatieInput.addEventListener('keydown', (e) => {
    const items = [...suggList.querySelectorAll('.autocomplete-item')]
    if (!items.length) {
      if (e.key === 'Enter') zoek()
      return
    }

    if (e.key === 'ArrowDown') {
      e.preventDefault()
      focusedIndex = Math.min(focusedIndex + 1, items.length - 1)
      updateFocus(items)
    } else if (e.key === 'ArrowUp') {
      e.preventDefault()
      focusedIndex = Math.max(focusedIndex - 1, -1)
      updateFocus(items)
    } else if (e.key === 'Enter') {
      e.preventDefault()
      if (focusedIndex >= 0) {
        items[focusedIndex].dispatchEvent(new Event('mousedown'))
      } else {
        sluitSuggesties()
        zoek()
      }
    } else if (e.key === 'Escape') {
      sluitSuggesties()
    }
  })

  // Sluit dropdown bij klik buiten het veld
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.autocomplete-wrapper')) sluitSuggesties()
  })

  // ── Hulpfuncties ───────────────────────────────────────────────

  function setStatus(msg, type) {
    statusBar.textContent = msg
    statusBar.className   = type || ''
  }

  function setMode(m) {
    mode = m
    document.getElementById('btn-km').classList.toggle('active', m === 'km')
    document.getElementById('btn-tijd').classList.toggle('active', m === 'tijd')
    document.getElementById('group-km').style.display   = m === 'km'   ? '' : 'none'
    document.getElementById('group-tijd').style.display = m === 'tijd' ? '' : 'none'
    setStatus('')
  }

  async function geocode(query) {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`
    const res  = await fetch(url, { headers: { 'Accept-Language': 'nl' } })
    if (!res.ok) throw new Error('Geocoding mislukt')
    const data = await res.json()
    if (!data.length) throw new Error(`"${query}" niet gevonden`)
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) }
  }

  function clearLayers() {
    if (marker) { map.removeLayer(marker); marker = null }
    if (layer)  { map.removeLayer(layer);  layer  = null }
  }

  // ── Hoofdfunctie ───────────────────────────────────────────────

  async function zoek() {
    const locatie = locatieInput.value.trim()
    if (!locatie) { setStatus('Vul een startlocatie in.', 'error'); return }

    const btn = document.getElementById('zoek-btn')
    btn.disabled = true
    sluitSuggesties()
    setStatus('Locatie zoeken…', '')

    try {
      // Gebruik gekozen coördinaten als beschikbaar, anders geocode de tekst
      const loc = selectedCoords
        ? selectedCoords
        : await geocode(locatie)

      clearLayers()
      marker = L.marker([loc.lat, loc.lon]).addTo(map)

      if (mode === 'km') {
        await toonCircel(loc, locatie)
      } else {
        await toonIsochrone(loc, locatie)
      }
    } catch (err) {
      setStatus(err.message, 'error')
    } finally {
      btn.disabled = false
    }
  }

  async function toonCircel(loc, label) {
    const km = parseFloat(document.getElementById('km-input').value)
    if (!km || km <= 0) { setStatus('Vul een geldig aantal kilometers in.', 'error'); return }

    layer = L.circle([loc.lat, loc.lon], {
      radius: km * 1000,
      color: '#4f6ef7',
      fillColor: '#4f6ef7',
      fillOpacity: 0.10,
      weight: 2,
      dashArray: '6 4',
    }).addTo(map)

    marker.bindPopup(`
      <div class="info-popup">
        <strong>${label}</strong><br>
        Hemelsbreed: <strong>${km} km</strong>
      </div>`).openPopup()

    map.fitBounds(layer.getBounds(), { padding: [30, 30] })
    setStatus(`✓ ${label} — radius ${km} km`, 'ok')
  }

  async function toonIsochrone(loc, label) {
    const uren     = parseInt(document.getElementById('uren-input').value) || 0
    const min      = parseInt(document.getElementById('min-input').value)  || 0
    const seconden = uren * 3600 + min * 60

    if (seconden <= 0) { setStatus('Vul een reistijd in.', 'error'); return }

    setStatus('Bereikbaar gebied berekenen…', '')

    const res = await fetch('/.netlify/functions/isochrone', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        locations:  [[loc.lon, loc.lat]],
        range:      [seconden],
        range_type: 'time',
        smoothing:  0.5,
      }),
    })

    if (res.status === 401 || res.status === 403) {
      throw new Error('ORS API-sleutel ongeldig. Neem contact op met de beheerder.')
    }
    if (res.status === 429) {
      throw new Error('Dagelijkse limiet bereikt. Probeer het morgen opnieuw.')
    }
    if (!res.ok) {
      throw new Error('Fout bij berekening (' + res.status + '). Probeer het later opnieuw.')
    }

    const geojson = await res.json()

    layer = L.geoJSON(geojson, {
      style: {
        color:       '#e67e22',
        fillColor:   '#e67e22',
        fillOpacity: 0.12,
        weight:      2.5,
        dashArray:   '6 4',
      }
    }).addTo(map)

    const tijdLabel = [
      uren > 0 ? `${uren} uur` : '',
      min  > 0 ? `${min} min` : '',
    ].filter(Boolean).join(' ')

    marker.bindPopup(`
      <div class="info-popup">
        <strong>${label}</strong><br>
        Bereikbaar met de auto in: <strong>${tijdLabel}</strong>
      </div>`).openPopup()

    map.fitBounds(layer.getBounds(), { padding: [30, 30] })
    setStatus(`✓ ${label} — bereikbaar in ${tijdLabel}`, 'ok')
  }

  // ── Init ────────────────────────────────────────────────────────
  laadDefault()
</script>

</body>
</html>
