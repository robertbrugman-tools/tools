<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>@media (pointer:coarse){input,select,textarea{font-size:16px!important}}</style>
<title>Aanvragen | Respyre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Designtaal van gorespyre.com: warm gebroken wit, mosgroen, zachte serif voor koppen, IBM Plex Sans voor tekst, ronde groene knoppen */
  :root {
    --paper: #f7f4f0; --surface: #ffffff; --ink: #212121; --body: #4d4d4d; --mute: #7d7a74;
    --rule: #e6e0d7; --rule-2: #efeae2;
    --green: #3f6944; --green-d: #2f5234; --green-l: #e7efe5; --link: #379237;
    --warn: #8a5300; --warn-bg: #fff3dc; --alert: #b3261e; --alert-bg: #fde7e5;
    --serif: 'Fraunces', 'Recoleta', Georgia, serif;
    --sans: 'IBM Plex Sans', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --btn: 'Montserrat', 'IBM Plex Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--paper); color: var(--body); min-height: 100vh; -webkit-font-smoothing: antialiased; line-height: 1.5; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--link); }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 6px; }
  .logo { display: block; height: 34px; width: auto; }

  #authScreen { position: fixed; inset: 0; background: var(--paper); display: flex; flex-direction: column; gap: 28px; align-items: center; justify-content: center; padding: 24px; z-index: 300; }
  #authScreen .logo { height: 44px; }
  .auth-box { background: var(--surface); border: 1px solid var(--rule); border-radius: 22px; padding: 36px 34px; width: 100%; max-width: 380px; }
  .auth-box h1 { font-family: var(--serif); font-size: 1.6rem; font-weight: 500; color: var(--green); margin-bottom: 4px; }
  .auth-box > p { font-size: 0.9rem; color: var(--mute); margin-bottom: 24px; }
  .fg { margin-bottom: 14px; }
  .fg label, .lbl { display: block; font-size: 0.78rem; font-weight: 500; color: var(--mute); margin-bottom: 5px; }
  input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 12px; font: inherit; font-size: 0.9rem; background: #fff; color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-l); }
  textarea { resize: vertical; line-height: 1.55; }
  .submit-btn { width: 100%; padding: 13px; margin-top: 6px; }
  .msg { font-size: .84rem; text-align: center; margin-top: 10px; min-height: 1.2em; color: var(--alert); }

  #app { display: none; padding: 22px 24px 64px; }
  .wrap { max-width: 1320px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 10px 14px 10px 24px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand h1 { font-family: var(--serif); font-size: 1.25rem; font-weight: 500; color: var(--green); letter-spacing: -0.01em; }
  .brand .sub { font-size: .84rem; color: var(--mute); }
  .top-right { display: flex; align-items: center; gap: 14px; }
  .back-link { font-size: .84rem; color: var(--mute); text-decoration: none; }
  .back-link:hover { color: var(--green); }

  .btn { font-family: var(--btn); font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: var(--green); color: #fff; border: 1px solid var(--green); border-radius: 999px; padding: 10px 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s; }
  .btn:hover { background: var(--green-d); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--green); }
  .btn.ghost:hover { background: var(--green-l); }
  .btn.small { padding: 6px 14px; font-size: .66rem; }
  .btn svg { width: 14px; height: 14px; }
  .btn.spin svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-line { font-size: .82rem; color: var(--mute); }
  .status-line.err { color: var(--alert); font-weight: 500; }

  .layout { display: grid; grid-template-columns: 260px minmax(280px, 1fr) minmax(380px, 1.25fr); gap: 16px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 22px; }

  .buckets { padding: 10px; position: sticky; top: 14px; }
  .bk { width: 100%; text-align: left; background: none; border: none; border-radius: 14px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; color: var(--body); }
  .bk:hover { background: var(--paper); }
  .bk[aria-pressed="true"] { background: var(--green); color: #fff; }
  .bk .n { font-variant-numeric: tabular-nums; font-weight: 600; }
  .bk .nm { font-size: .88rem; line-height: 1.3; font-weight: 500; }
  .bk small { display: block; font-size: .72rem; color: var(--mute); margin-top: 2px; font-weight: 400; }
  .bk[aria-pressed="true"] small { color: #d3e2d1; }
  .bk.zero .n { color: var(--mute); font-weight: 400; }
  .bk[aria-pressed="true"].zero .n { color: #d3e2d1; }

  .list { padding: 8px; min-height: 120px; }
  .list h2 { font-family: var(--serif); font-size: 1.1rem; font-weight: 500; color: var(--green); padding: 12px 12px 2px; }
  .list .hint { font-size: .8rem; color: var(--mute); padding: 0 12px 10px; }
  .row { width: 100%; text-align: left; background: none; border: none; border-radius: 14px; padding: 11px 12px; display: block; border-top: 1px solid var(--rule-2); }
  .row:first-of-type { border-top: none; }
  .row:hover { background: var(--paper); }
  .row[aria-current="true"] { background: var(--green-l); }
  .row .l1 { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; font-weight: 600; color: var(--ink); }
  .row .l1 span:last-child { font-weight: 400; color: var(--mute); font-size: .78rem; white-space: nowrap; }
  .row .l2 { font-size: .82rem; color: var(--body); margin-top: 2px; }
  .tag { display: inline-block; font-size: .68rem; border-radius: 999px; padding: 1px 8px; background: var(--warn-bg); color: var(--warn); margin-left: 6px; font-weight: 500; vertical-align: 1px; }
  .tag.red { background: var(--alert-bg); color: var(--alert); }
  .tag.green { background: var(--green-l); color: var(--green-d); }
  .empty { padding: 18px 12px; color: var(--mute); font-size: .9rem; line-height: 1.6; }

  .detail { padding: 26px; position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow: auto; }
  .detail h2 { font-family: var(--serif); font-size: 1.45rem; font-weight: 500; color: var(--green); letter-spacing: -.01em; }
  .detail .org { color: var(--mute); font-size: .92rem; margin-top: 2px; }
  .sec { font-family: var(--btn); font-size: .66rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 22px 0 8px; }
  dl.facts { display: grid; grid-template-columns: 120px 1fr; gap: 7px 14px; margin: 14px 0; font-size: .88rem; }
  dl.facts dt { color: var(--mute); }
  dl.facts dd { word-break: break-word; white-space: pre-wrap; color: var(--ink); }
  dl.facts.raw { background: var(--paper); border-radius: 14px; padding: 14px 16px; margin-top: 4px; }
  .why { background: var(--green-l); border-radius: 14px; padding: 11px 14px; font-size: .84rem; color: var(--green-d); line-height: 1.5; margin-bottom: 10px; }
  .flag { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 10px 14px; font-size: .86rem; margin-bottom: 8px; font-weight: 500; }
  .flag.red { background: var(--alert-bg); color: var(--alert); }

  .files { display: flex; flex-direction: column; gap: 8px; }
  .file { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; background: var(--paper); border-radius: 14px; padding: 10px 14px; }
  .file .nm { font-size: .88rem; color: var(--ink); word-break: break-word; }
  .file .meta { font-size: .74rem; color: var(--mute); }
  .file .acts { display: flex; gap: 8px; }
  .file img.thumb { grid-column: 1 / -1; max-width: 100%; max-height: 260px; border-radius: 10px; border: 1px solid var(--rule); }
  .file .err { grid-column: 1 / -1; font-size: .78rem; color: var(--alert); }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .photo { background: var(--paper); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .photo .ph { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; background: var(--rule-2); display: flex; align-items: center; justify-content: center; font-size: .74rem; color: var(--mute); text-align: center; padding: 6px; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; cursor: zoom-in; display: block; }
  .photo .cap { font-size: .72rem; color: var(--mute); word-break: break-word; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .photo .cap button { background: none; border: none; color: var(--link); font-size: .72rem; padding: 0; text-decoration: underline; }
  .note-item .q { font-weight: 600; margin-top: 4px; }
  .notes { display: flex; flex-direction: column; gap: 8px; }
  .note-item { background: var(--paper); border-radius: 14px; padding: 10px 14px; font-size: .86rem; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .note-item .meta { font-size: .72rem; color: var(--mute); margin-bottom: 3px; }

  .ctrl { display: grid; grid-template-columns: 1fr 120px; gap: 10px; margin-bottom: 10px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
  .draft { margin-top: 20px; border-top: 1px solid var(--rule); padding-top: 18px; }
  #dBody { min-height: 300px; }
  .note { font-size: .78rem; color: var(--mute); margin-top: 6px; line-height: 1.5; }

  @media (max-width: 1100px) { .layout { grid-template-columns: 230px 1fr; } .detail { grid-column: 1 / -1; position: static; max-height: none; } }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } .buckets { position: static; } #app { padding: 14px 12px 48px; } .top { border-radius: 24px; padding: 12px 16px; } }
</style>
</head>

<div id="authScreen">
  <svg class="logo" viewBox="0 0 1000 299" role="img" aria-label="Respyre"><use href="#respyre-logo"/></svg>
  <div class="auth-box">
    <h1>Aanvragen</h1>
    <p>Log in met je Hub-account</p>
    <div class="fg"><label for="authEmail">E-mailadres</label><input type="email" id="authEmail" placeholder="jouw@email.nl" onkeydown="if(event.key==='Enter')login()"></div>
    <div class="fg"><label for="authPw">Wachtwoord</label><input type="password" id="authPw" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn submit-btn" id="btnLogin" onclick="login()">Inloggen</button>
    <p class="msg" id="authMsg"></p>
  </div>

<div id="app">
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 1000 299" role="img" aria-label="Respyre"><use href="#respyre-logo"/></svg>

<script>
  const HUB_URL = 'https://swrunlzeydmcskceqdju.supabase.co'
  const HUB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3cnVubHpleWRtY3NrY2VxZGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNjE2MDgsImV4cCI6MjA5MjkzNzYwOH0.V7haNdFPFJuvJJTbjhiUzKrWG8trW4UeRIJveAhFOgs'
  const sb = supabase.createClient(HUB_URL, HUB_KEY)
  const FN_LIST = '/.netlify/functions/aanvragen-list'
  const FN_DRAFT = '/.netlify/functions/aanvragen-draft'
  const FN_DETAIL = '/.netlify/functions/aanvragen-detail'
  const FN_FILE = '/.netlify/functions/aanvragen-file'
  const ORDER = ['p_klein','p_nl','p_buiten','b_benelux_de','b_europa','b_wereld','grens','betonproducent','samenwerking','handmatig']
  const IMG_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp']

  let data = null
  let current = localStorage.getItem('aanvragen_bucket') || 'b_benelux_de'
  let selectedId = null
  const drafts = {}
  const details = {}
  let overrides = {}
  try { overrides = JSON.parse(localStorage.getItem('aanvragen_override') || '{}') } catch (_) { overrides = {} }

  ;(async () => {
    const { data: { session } } = await sb.auth.getSession()
    if (session) enter()
  })()

  async function login() {
    const email = document.getElementById('authEmail').value.trim()
    const pw = document.getElementById('authPw').value
    const btn = document.getElementById('btnLogin'), msg = document.getElementById('authMsg')
    if (!email || !pw) { msg.textContent = 'Vul e-mail en wachtwoord in.'; return }
    btn.disabled = true; btn.textContent = 'Bezig...'
    const { error } = await sb.auth.signInWithPassword({ email, password: pw })
    btn.disabled = false; btn.textContent = 'Inloggen'
    if (error) msg.textContent = 'Inloggen mislukt. Controleer je gegevens.'
    else enter()
  }
  function enter() {
    document.getElementById('authScreen').style.display = 'none'
    document.getElementById('app').style.display = 'block'
    load(false)
  }
  async function authHeader() {
    const { data: { session } } = await sb.auth.getSession()
    if (!session) {
      document.getElementById('authScreen').style.display = 'flex'
      document.getElementById('app').style.display = 'none'
      return null
    }
    return { Authorization: 'Bearer ' + session.access_token }
  }

  const esc = s => String(s === null || s === undefined ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  const dt = iso => {
    const d = new Date(iso), now = new Date()
    const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5)
    const t = d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })
    if (days === 0) return 'vandaag ' + t
    if (days === 1) return 'gisteren ' + t
    return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' })
  }
  const fmtSize = n => !n ? '' : n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' kB' : (n / 1048576).toFixed(1) + ' MB'
  function setStatus(t, err) { const el = document.getElementById('status'); el.textContent = t; el.className = 'status-line' + (err ? ' err' : '') }

  let lastRefresh = null, lastFailed = false, loading = false
  const hm = d => d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })
  function agoText() {
    const m = Math.floor((Date.now() - lastRefresh) / 60000)
    return m < 1 ? 'zojuist' : m < 60 ? m + ' min geleden' : Math.floor(m / 60) + ' uur geleden'
  }
  function updateStatus() {
    if (!lastRefresh || lastFailed || loading) return
    setStatus('Laatst ververst om ' + hm(new Date(lastRefresh)) + ' (' + agoText() + ').')
  }
  setInterval(updateStatus, 30000)
  // Terug in het tabblad na meer dan 30 minuten: automatisch verversen.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && lastRefresh && Date.now() - lastRefresh > 30 * 60000 && document.getElementById('app').style.display === 'block') load(true)
  })

  async function load(isRefresh) {
    if (loading) return
    const headers = await authHeader(); if (!headers) return
    const btn = document.getElementById('btnRefresh')
    loading = true; lastFailed = false
    btn.disabled = true; btn.classList.add('spin')
    setStatus('Ophalen uit Pipedrive...')
    try {
      const res = await fetch(FN_LIST, { headers })
      const body = await res.json().catch(() => ({}))
      if (res.status === 403) throw new Error('Dit account heeft geen toegang tot deze tool.')
      if (!res.ok) throw new Error(body.error || ('De server antwoordde met status ' + res.status + '.'))
      data = body
      Object.keys(details).forEach(k => { (details[k].cache ? Object.values(details[k].cache) : []).forEach(e => { if (e.url) URL.revokeObjectURL(e.url) }); delete details[k] })
      // Wat niet meer in "Form ingevuld" staat (verplaatst of afgehandeld) valt ook hier weg, inclusief concepten en handmatige bakjes.
      const ids = new Set(data.items.map(x => x.id))
      Object.keys(drafts).forEach(k => { if (!ids.has(Number(k))) delete drafts[k] })
      let changed = false
      Object.keys(overrides).forEach(k => { if (!ids.has(Number(k))) { delete overrides[k]; changed = true } })
      if (changed) localStorage.setItem('aanvragen_override', JSON.stringify(overrides))
      if (selectedId && !ids.has(selectedId)) selectedId = null
      // "nieuw": niet gezien bij het vorige bezoek of de vorige verversing
      let seen = null
      try { seen = JSON.parse(localStorage.getItem('aanvragen_seen') || 'null') } catch (_) { seen = null }
      data.items.forEach(x => { x.isNew = Array.isArray(seen) && !seen.includes(x.id) })
      try { localStorage.setItem('aanvragen_seen', JSON.stringify([...ids].slice(0, 500))) } catch (_) { /* geen opslag beschikbaar */ }
      lastRefresh = Date.now()
      loading = false
      updateStatus()
      render()
    } catch (err) {
      lastFailed = true
      setStatus(err.message, true)
    }
    loading = false
    btn.disabled = false; btn.classList.remove('spin')
  }

  const bucketOf = i => overrides[i.id] && data.buckets[overrides[i.id]] ? overrides[i.id] : i.bucket
  function counts() {
    const c = {}; ORDER.forEach(k => c[k] = 0)
    data.items.forEach(i => { c[bucketOf(i)]++ })
    return c
  }

  function render() {
    document.getElementById('sub').textContent = data.total + (data.total === 1 ? ' aanvraag' : ' aanvragen') + ' sinds 1 oktober 2026'
    renderBuckets(); renderList(); renderDetail()
  }

  function renderBuckets() {
    const c = counts()
    document.getElementById('buckets').innerHTML = ORDER.map(k => {
      const b = data.buckets[k]
      return `<button class="bk ${c[k] ? '' : 'zero'}" data-k="${k}" aria-pressed="${k === current}"><span class="nm">${esc(b.nr)}. ${esc(b.naam)}<small>${esc(b.uitleg)}</small></span><span class="n">${c[k]}</span></button>`
    }).join('')
    document.querySelectorAll('.bk').forEach(el => el.addEventListener('click', () => {
      current = el.dataset.k; localStorage.setItem('aanvragen_bucket', current); selectedId = null; render()
    }))
  }

  function renderList() {
    const b = data.buckets[current]
    const items = data.items.filter(i => bucketOf(i) === current).sort((a, z) => new Date(z.addTime) - new Date(a.addTime))
    let h = `<h2>${esc(b.naam)}</h2><p class="hint">${esc(b.uitleg)}</p>`
    if (!items.length) h += '<p class="empty">Geen aanvragen in dit bakje.</p>'
    h += items.map(i => {
      const tags = (i.noGo ? '<span class="tag red">no-go</span>' : '') + (i.flags.length && !i.noGo ? '<span class="tag">let op</span>' : '') + (i.isNew ? '<span class="tag green">nieuw</span>' : '') + (drafts[i.id] ? '<span class="tag green">concept</span>' : '')
      const l2 = [i.org, i.land.naam, i.m2 !== null ? i.m2 + ' m²' : 'm² onbekend'].filter(Boolean).join(' · ')
      return `<button class="row" data-id="${i.id}" aria-current="${i.id === selectedId}"><div class="l1"><span>${esc(i.person.name || i.title)}${tags}</span><span>${esc(dt(i.addTime))}</span></div><div class="l2">${esc(l2)}</div></button>`
    }).join('')
    document.getElementById('list').innerHTML = h
    document.querySelectorAll('.row').forEach(el => el.addEventListener('click', () => { selectedId = Number(el.dataset.id); renderList(); renderDetail() }))
  }

  // Eén lijst met gegevens: locatie en oppervlak samengevoegd, de rest van de ingevulde velden eronder.
  const norm = t => String(t || '').toLowerCase().replace(/²/g, '2').replace(/\s+/g, '')
  function factsHtml(i) {
    const raw = {}; (i.raw || []).forEach(r => { if (r.value) raw[r.label] = r.value })
    const rows = []
    rows.push(['E-mail', esc(i.person.email || 'onbekend') + (i.priveMail ? ' <span class="tag">privé-adres</span>' : '')])
    rows.push(['Locatie', esc(raw['Locatie'] || i.land.naam || i.land.raw || 'onbekend')])
    const ingevuld = raw['Grootte'] || i.grootteTekst
    let opp
    if (i.m2 !== null) opp = esc(i.m2) + ' m²' + (ingevuld && norm(ingevuld) !== norm(i.m2 + ' m²') ? ' (ingevuld: "' + esc(ingevuld) + '")' : '')
    else opp = ingevuld ? esc(ingevuld) + ' (niet als getal te lezen)' : 'onbekend'
    rows.push(['Oppervlak', opp])
    const skip = ['Locatie', 'Grootte', 'Project name']
    ;(i.raw || []).filter(r => r.value && !skip.includes(r.label)).forEach(r => rows.push([r.label, esc(r.value)]))
    return rows.map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + v + '</dd>').join('')
  }

  function renderDetail() {
    const el = document.getElementById('detail')
    const i = data.items.find(x => x.id === selectedId)
    if (!i) { el.innerHTML = '<p class="empty">Kies een aanvraag.</p>'; return }
    const bk = bucketOf(i)
    const d = drafts[i.id]
    el.innerHTML = `
      <h2>${esc(i.person.name || i.title)}</h2>
      <div class="org">${esc(i.org || 'Geen organisatie')} · <a href="https://app.pipedrive.com/deal/${i.id}" target="_blank" rel="noopener">Pipedrive</a></div>
      <dl class="facts">${factsHtml(i)}</dl>
      ${i.noGo ? '<div class="flag red">No-go: ' + esc(i.flags[0]) + '</div>' : ''}
      ${i.flags.filter(x => !i.noGo || x !== i.flags[0]).map(x => '<div class="flag">' + esc(x) + '</div>').join('')}
      <div class="why"><b>Waarom dit bakje:</b> ${esc(i.reasons.join('. '))}.</div>

      <div class="sec">Bijlagen</div>
      <div id="filesBox" class="files"><p class="note">Laden...</p></div>

      <div class="sec">Notities in Pipedrive</div>
      <div id="notesBox" class="notes"><p class="note">Laden...</p></div>

      <div class="sec">Antwoord</div>
      <div class="ctrl">
        <div><label class="lbl" for="selBucket">Bakje voor het antwoord</label><select id="selBucket">${ORDER.map(k => `<option value="${k}" ${k === bk ? 'selected' : ''}>${esc(data.buckets[k].nr)}. ${esc(data.buckets[k].naam)}</option>`).join('')}</select></div>
        <div><label class="lbl" for="selLang">Taal</label><select id="selLang"><option value="">Auto</option><option value="nl">NL</option><option value="en">EN</option><option value="de">DE</option></select></div>
      </div>
      <label class="lbl" for="extra">Extra instructie (optioneel)</label>
      <input id="extra" type="text" placeholder="Bijvoorbeeld: noem ook de foto's van Utrecht" value="${esc(d ? d.extra : '')}">
      <div class="actions"><button class="btn" id="btnGen">${d ? 'Genereer opnieuw' : 'Genereer antwoord'}</button><span class="status-line" id="genStatus"></span></div>
      <div id="draftBox">${d ? draftHtml(i, d) : ''}</div>`
    document.getElementById('selBucket').addEventListener('change', e => {
      const v = e.target.value
      if (v === i.bucket) delete overrides[i.id]; else overrides[i.id] = v
      localStorage.setItem('aanvragen_override', JSON.stringify(overrides))
      renderBuckets(); renderList()
    })
    document.getElementById('btnGen').addEventListener('click', () => generate(i))
    bindDraft(i)
    loadDetail(i)
  }

  // ---- Bijlagen en notities ----
  const MIME_EXT = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', pdf: 'application/pdf' }
  const extOf = n => ((String(n || '').match(/\.([a-z0-9]+)$/i) || [])[1] || '').toLowerCase()
  const isImg = f => (MIME_EXT[extOf(f.name)] || '').startsWith('image/')
  const isPdf = f => extOf(f.name) === 'pdf' || f.type === 'pdf'
  const MAX_FILE = 4.5 * 1048576
  const tooBig = f => f.size && f.size > MAX_FILE

  async function loadDetail(i) {
    if (!details[i.id]) {
      const headers = await authHeader(); if (!headers) return
      try {
        const res = await fetch(FN_DETAIL + '?dealId=' + i.id, { headers })
        const body = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(body.error || ('Fout ' + res.status))
        details[i.id] = body
      } catch (err) {
        if (selectedId === i.id) {
          const fb = document.getElementById('filesBox'), nb = document.getElementById('notesBox')
          if (fb) fb.innerHTML = '<p class="note" style="color:var(--alert)">Bijlagen en notities laden mislukt: ' + esc(err.message) + '</p>'
          if (nb) nb.innerHTML = ''
        }
        return
      }
    }
    if (selectedId === i.id) renderDetailExtras(i)
  }

  // Haalt het bestand op (eenmalig per sessie) en bewaart het in het geheugen.
  function getFile(i, f) {
    const det = details[i.id]
    det.cache = det.cache || {}; det.pending = det.pending || {}
    if (det.cache[f.id]) return Promise.resolve(det.cache[f.id])
    if (!det.pending[f.id]) {
      det.pending[f.id] = (async () => {
        const headers = await authHeader(); if (!headers) throw new Error('Niet ingelogd.')
        const res = await fetch(FN_FILE + '?dealId=' + i.id + '&fileId=' + f.id, { headers })
        if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || ('Fout ' + res.status)) }
        const ct = (res.headers.get('content-type') || '').split(';')[0].trim().toLowerCase()
        const blob = await res.blob()
        const mime = IMG_TYPES.includes(ct) ? ct : (MIME_EXT[extOf(f.name)] || ct)
        det.cache[f.id] = { blob, mime }
        return det.cache[f.id]
      })().finally(() => { delete det.pending[f.id] })
    }
    return det.pending[f.id]
  }

  function saveBlob(entry, name) {
    const a = document.createElement('a')
    a.href = URL.createObjectURL(new Blob([entry.blob], { type: 'application/octet-stream' })); a.download = name
    document.body.appendChild(a); a.click(); a.remove()
  }

  async function runPool(tasks, n) {
    let k = 0
    await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, async () => { while (k < tasks.length) { const t = tasks[k++]; await t() } }))
  }

  const noteHtml = n => {
    const when = n.addTime ? new Date(n.addTime.replace(' ', 'T') + 'Z').toLocaleString('nl-NL', { dateStyle: 'medium', timeStyle: 'short' }) : ''
    const body = n.items
      ? n.items.map(it => '<div class="q">' + esc(it.nr + '. ' + it.vraag) + '</div><div>' + esc(it.antwoord) + '</div>').join('')
      : esc(n.text)
    return '<div class="note-item"><div class="meta">' + esc(when) + '</div>' + body + '</div>'
  }

  function renderDetailExtras(i) {
    const det = details[i.id]
    const fb = document.getElementById('filesBox'), nb = document.getElementById('notesBox')
    if (!fb || !nb || !det) return
    const files = det.files || []
    if (!files.length) fb.innerHTML = '<p class="note">Geen bijlagen bij deze aanvraag.</p>'
    else {
      const photos = files.filter(f => !f.remote && isImg(f) && !tooBig(f))
      const others = files.filter(f => !photos.includes(f))
      let h = ''
      if (photos.length) {
        h += '<div class="photos">' + photos.map(f => '<div class="photo" data-fid="' + f.id + '"><div class="ph">Laden...</div><div class="cap"><span>' + esc(f.name) + '</span><button data-act="dl" data-id="' + f.id + '">Download</button></div></div>').join('') + '</div>'
      }
      if (others.length) {
        h += '<div class="files" style="margin-top:' + (photos.length ? '10' : '0') + 'px">' + others.map(f => {
          let acts
          if (f.remote) acts = '<a class="btn small ghost" href="https://app.pipedrive.com/deal/' + i.id + '" target="_blank" rel="noopener">Open in Pipedrive</a>'
          else if (tooBig(f)) acts = '<a class="btn small ghost" href="https://app.pipedrive.com/deal/' + i.id + '" target="_blank" rel="noopener">Te groot, open in Pipedrive</a>'
          else acts = (isPdf(f) ? '<button class="btn small ghost" data-act="open" data-id="' + f.id + '">Open</button>' : '') + '<button class="btn small ghost" data-act="dl" data-id="' + f.id + '">Download</button>'
          return '<div class="file" data-fid="' + f.id + '"><div><div class="nm">' + esc(f.name) + '</div><div class="meta">' + esc([extOf(f.name).toUpperCase(), fmtSize(f.size)].filter(Boolean).join(' · ')) + '</div></div><div class="acts">' + acts + '</div></div>'
        }).join('') + '</div>'
      }
      h += '<p class="note">Bijlagen komen van de aanvrager. Foto\'s worden hier direct getoond. PDF\'s open je met de knop. Word, Excel en andere documenten worden alleen gedownload en nooit in de pagina geopend.</p>'
      fb.innerHTML = h
      fb.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => fileAction(i, b.dataset.act, Number(b.dataset.id), b)))
      runPool(photos.map(f => async () => {
        const holder = fb.querySelector('.photo[data-fid="' + f.id + '"] .ph')
        try {
          const entry = await getFile(i, f)
          if (selectedId !== i.id || !holder.isConnected) return
          holder.innerHTML = ''
          const img = document.createElement('img'); img.alt = f.name
          const url = (entry.url = entry.url || URL.createObjectURL(new Blob([entry.blob], { type: entry.mime })))
          img.src = url
          img.addEventListener('click', () => window.open(url, '_blank', 'noopener'))
          holder.appendChild(img)
        } catch (err) { if (holder.isConnected) holder.textContent = err.message }
      }), 3)
    }
    nb.innerHTML = det.notes.length ? det.notes.map(noteHtml).join('') : '<p class="note">Geen eigen notities bij deze aanvraag.</p>'
    if (det.verborgen) nb.innerHTML += '<p class="note">Het ingevulde formulier staat ook als notitie in Pipedrive. Wat daar dubbel is met de velden hierboven is weggelaten.</p>'
  }

  async function fileAction(i, act, fileId, btn) {
    const f = details[i.id].files.find(x => x.id === fileId)
    const holder = btn.closest('.file, .photo')
    const old = btn.textContent
    btn.disabled = true; btn.textContent = '...'
    const prev = holder.querySelector('.err'); if (prev) prev.remove()
    try {
      const entry = await getFile(i, f)
      if (act === 'open' && (entry.mime === 'application/pdf' || isPdf(f))) {
        window.open(URL.createObjectURL(new Blob([entry.blob], { type: 'application/pdf' })), '_blank', 'noopener')
      } else saveBlob(entry, f.name)
    } catch (err) {
      const p = document.createElement('div'); p.className = 'err'; p.textContent = err.message; holder.appendChild(p)
    }
    btn.disabled = false; btn.textContent = old
  }

  // ---- Concept ----
  function draftHtml(i, d) {
    return `<div class="draft">
      <label class="lbl" for="dSubj">Onderwerp</label><input id="dSubj" type="text" value="${esc(d.onderwerp)}">
      <label class="lbl" for="dBody" style="margin-top:10px">Tekst (aan te passen)</label><textarea id="dBody">${esc(d.tekst)}</textarea>
      <div class="actions">
        <button class="btn" id="btnMail" ${i.person.email ? '' : 'disabled'}>Open in e-mail</button>
        <button class="btn ghost" id="btnCopyRich">Kopieer opgemaakt</button>
        <button class="btn ghost" id="btnCopy">Kopieer tekst</button>
        <span class="status-line" id="copyStatus"></span>
      </div>
      <p class="note">Geen handtekening en geen afsluitgroet, die voeg je zelf toe. Kopieer opgemaakt plakt de kopjes vet in je mail. Past je een kopje aan, dan wordt die regel niet meer vet. Controleer prijzen en details voor je verstuurt. Bakje: ${esc(data.buckets[d.bucket].naam)}, model: ${esc(d.model)}.${i.person.email ? '' : ' Er is geen e-mailadres bij deze aanvraag, dus alleen kopiëren kan.'}</p>
      <div id="fbBox"></div>
    </div>`
  }
  function bindDraft(i) {
    const btnMail = document.getElementById('btnMail'), btnCopy = document.getElementById('btnCopy')
    if (!btnCopy) return
    if (window.fbInit) fbInit(i, drafts[i.id])
    const body = () => document.getElementById('dBody').value
    const subj = () => document.getElementById('dSubj').value
    const keep = () => { drafts[i.id].tekst = body(); drafts[i.id].onderwerp = subj() }
    document.getElementById('dBody').addEventListener('input', keep)
    document.getElementById('dSubj').addEventListener('input', keep)
    btnCopy.addEventListener('click', async () => {
      const el = document.getElementById('copyStatus')
      try { await navigator.clipboard.writeText(body()); el.textContent = 'Gekopieerd.' } catch (_) { el.textContent = 'Kopiëren lukt niet in deze browser.' }
    })
    document.getElementById('btnCopyRich').addEventListener('click', async () => {
      const el = document.getElementById('copyStatus')
      const kop = new Set((drafts[i.id].kopjes || []).map(k => k.trim()))
      const html = '<div style="font-family:Calibri,Arial,sans-serif;font-size:11pt">' + body().split('\n').map(l => {
        if (!l.trim()) return '<p style="margin:0"><br></p>'
        return kop.has(l.trim()) ? '<p style="margin:0"><b>' + esc(l) + '</b></p>' : '<p style="margin:0">' + esc(l) + '</p>'
      }).join('') + '</div>'
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([body()], { type: 'text/plain' }) })])
        el.textContent = 'Gekopieerd met vette kopjes.'
      } catch (_) {
        try { await navigator.clipboard.writeText(body()); el.textContent = 'Opgemaakt kopiëren lukt hier niet, de gewone tekst is gekopieerd.' } catch (__) { el.textContent = 'Kopiëren lukt niet in deze browser.' }
      }
    })
    if (btnMail) btnMail.addEventListener('click', () => {
      const text = body().replace(/\r?\n/g, '\r\n')
      const url = 'mailto:' + encodeURIComponent(i.person.email) + '?subject=' + encodeURIComponent(subj()) + '&body=' + encodeURIComponent(text)
      if (url.length > 7000) { document.getElementById('copyStatus').textContent = 'De tekst is te lang voor een e-maillink. Gebruik Kopieer tekst.'; return }
      window.location.href = url
    })
  }

  async function generate(i) {
    const headers = await authHeader(); if (!headers) return
    const btn = document.getElementById('btnGen'), st = document.getElementById('genStatus')
    const bucket = document.getElementById('selBucket').value
    const lang = document.getElementById('selLang').value
    const extra = document.getElementById('extra').value.trim()
    if (bucket === 'handmatig') { st.textContent = 'Kies eerst een ander bakje voor het antwoord.'; st.className = 'status-line err'; return }
    btn.disabled = true; st.className = 'status-line'; st.textContent = 'Concept wordt geschreven, dit duurt ongeveer 10 seconden...'
    try {
      const res = await fetch(FN_DRAFT, { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify({ dealId: i.id, bucket, lang: lang || undefined, extra }) })
      const body = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(body.error || ('Fout ' + res.status))
      drafts[i.id] = { ...body, extra }
      renderList(); renderDetail()
    } catch (err) {
      st.textContent = err.message; st.className = 'status-line err'
    }
    const b2 = document.getElementById('btnGen'); if (b2) b2.disabled = false
  }
</script>
<script src="feedback.js"></script>
<script src="stats.js"></script>
</body>
